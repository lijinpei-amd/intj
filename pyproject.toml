[project]
name = "intj"
version = "0.1.0"
description = "Incompatible Triton Jit: a low-overhead host launcher for triton kernels on AMD and NVIDIA GPUs"
requires-python = ">=3.12"
dependencies = ["jinja2", "triton>=3.8", "torch"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["intj*"]

[tool.setuptools.package-data]
intj = ["runtime/*"]

[tool.pyright]
pythonVersion = "3.12"
include = ["intj", "tests", "benchmarks"]
typeCheckingMode = "strict"
# triton, torch and jinja2 ship no type information, so every value coming out of
# them is Unknown or stub-less. Those reports say nothing about intj's own code.
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
# tests/ and benchmarks/ carry a `# pyright: standard` header: they are kernels and
# timing scripts, not the shipped API surface.
