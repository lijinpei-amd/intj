# Verified torch ABIs, one table per torch major.minor.
#
# Never write an entry by hand.  Run `python -m intj.torch_intf.abi_detect` on
# the target torch and paste what it prints: every number is measured against
# torch's own accessors, so a pasted entry is verified by construction, while an
# edited one is a guess -- and a wrong offset cannot raise, it reads whatever
# lies at that address.  `python -m intj.torch_intf.cpp_detect` checks the same
# numbers independently, from torch's C++ headers.
#
#   cdata: byte offset from the end of PyObject_HEAD to the TensorImpl* slot;
#          set_torch_version adds its compiled sizeof(PyObject) at module load
#   storage .. s_nbytes: byte offsets into TensorImpl / StorageImpl
#   dtypes: [torch's spelling, element size], indexed by at::ScalarType code
#
# The dtypes list is what makes a version *known*: intj refuses to read tensors
# through these offsets unless the running torch's dtypes are exactly the ones
# that were there when the offsets were measured.

