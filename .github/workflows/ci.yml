# Lint, typecheck and the GPU-free tests of the freshly built wheel on every
# distro x python cell.  All logic lives in `ninja -C ci`; see ci/AGENTS.md.
name: ci

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      cells: ${{ steps.read.outputs.cells }}
      unpublished: ${{ steps.read.outputs.unpublished }}
      primary: ${{ steps.read.outputs.primary }}
    steps:
      - uses: actions/checkout@v7
      - run: pipx install ninja
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: ninja -C ci matrix
      - id: read
        run: |
          {
            echo "cells=$(jq -c .cpu ci/out/matrix.json)"
            echo "unpublished=$(jq -c .cpu_unpublished ci/out/matrix.json)"
            echo "primary=$(jq -r .primary ci/out/matrix.json)"
          } >> "$GITHUB_OUTPUT"

  images:
    needs: matrix
    # Only the cells whose tag is not in the registry yet; an empty matrix is an
    # error, so the job is skipped instead.
    if: ${{ needs.matrix.outputs.unpublished != '[]' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.matrix.outputs.unpublished) }}
    name: image ${{ matrix.cell.id }}
    steps:
      - uses: actions/checkout@v7
      - run: pipx install ninja
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: ninja -C ci push-image
        env:
          CELL: ${{ matrix.cell.id }}
          FLAVOR: cpu

  # Built on both runner OSes to check the build itself; the tests install
  # the ubuntu-24.04 one.
  wheel:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    name: wheel ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pipx install ninja
      - run: ninja -C ci wheel
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: ci/out/dist/

  test:
    needs: [matrix, images, wheel]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.matrix.outputs.cells) }}
    name: test ${{ matrix.cell.id }}
    container:
      image: ${{ matrix.cell.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      INTJ_MODE: wheel
    if: ${{ !cancelled() && needs.wheel.result == 'success' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wheel-ubuntu-24.04
          path: ci/out/dist/
      - run: ninja -C ci install
      - run: ninja -C ci test-cpu

  lint:
    needs: [matrix, images]
    # Runs in the primary image, so another cell's image failing must not skip it.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.matrix.outputs.primary }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: ninja -C ci lint

  typecheck:
    needs: [matrix, images]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.matrix.outputs.primary }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: ninja -C ci typecheck

  bench-host:
    needs: [matrix, images, wheel]
    if: ${{ !cancelled() && needs.wheel.result == 'success' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.matrix.outputs.primary }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      INTJ_MODE: wheel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wheel-ubuntu-24.04
          path: ci/out/dist/
      - run: ninja -C ci install
      - run: ninja -C ci bench-host
      - uses: actions/upload-artifact@v7
        with:
          name: bench-host
          path: ci/out/bench/
