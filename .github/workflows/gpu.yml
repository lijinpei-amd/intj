# The full suite and GPU benchmarks of the freshly built wheel, on a
# self-hosted gfx942 runner.  Manual only until such a runner is registered.
name: gpu

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      cells: ${{ steps.read.outputs.cells }}
    steps:
      - uses: actions/checkout@v4
      - run: pipx install ninja
      - run: ninja -C ci matrix
      - id: read
        run: echo "cells=$(jq -c .rocm ci/out/matrix.json)" >> "$GITHUB_OUTPUT"

  images:
    needs: matrix
    # rocm images are ~5 GB each: too large for hosted runners' disk.
    runs-on: [self-hosted, gfx942]
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.matrix.outputs.cells) }}
    name: image ${{ matrix.cell.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: ninja -C ci push-image
        env:
          CELL: ${{ matrix.cell.id }}
          FLAVOR: rocm

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install ninja
      - run: ninja -C ci wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: ci/out/dist/

  test:
    needs: [matrix, images, wheel]
    runs-on: [self-hosted, gfx942]
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.matrix.outputs.cells) }}
    name: gpu ${{ matrix.cell.id }}
    container:
      image: ${{ matrix.cell.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device=/dev/kfd --device=/dev/dri --group-add video --ipc=host --security-opt seccomp=unconfined
    env:
      INTJ_MODE: wheel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: ci/out/dist/
      - run: ninja -C ci install
      - run: ninja -C ci test-gpu
      - run: ninja -C ci bench-gpu
      - uses: actions/upload-artifact@v4
        with:
          name: bench-gpu-${{ matrix.cell.id }}
          path: ci/out/bench/
      # This job runs as root in a container on the persistent self-hosted
      # runner; without this, root-owned files left in $GITHUB_WORKSPACE make
      # the next job's host checkout fail with EACCES.
      - if: always()
        run: chown -R --reference="$GITHUB_WORKSPACE/.." "$GITHUB_WORKSPACE"
